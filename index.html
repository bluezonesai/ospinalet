<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ospinalet</title>

<style>
:root{
  --bg:#F1F7F9;
  --surface:#FFFFFF;
  --surface-2:#F5F9FB;
  --line:#D7E3E9;
  --ink:#17262E;
  --muted:#5F7480;
  --accent:#0B7A8F;
  --accent-ink:#FFFFFF;
  --accent-soft:#DDEFF3;
  --warm:#E2703A;
  --warm-soft:#FCEBE2;
  --good:#2F8F5B;
  --good-soft:#DFF2E6;
  --bad:#C6403A;
  --bad-soft:#FBE3E1;
  --shadow:0 2px 10px rgba(16,40,50,.06);
  --radius:16px;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1A1F; --surface:#16242B; --surface-2:#1C2E36; --line:#2C414B;
    --ink:#E6EEF1; --muted:#93A8B2; --accent:#5CC4D6; --accent-ink:#0F1A1F; --accent-soft:#163B45;
    --warm:#F0916A; --warm-soft:#3A251C;
    --good:#7ED3A2; --good-soft:#173A2A; --bad:#F2938B; --bad-soft:#3D211F;
    --shadow:0 2px 10px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0F1A1F; --surface:#16242B; --surface-2:#1C2E36; --line:#2C414B;
  --ink:#E6EEF1; --muted:#93A8B2; --accent:#5CC4D6; --accent-ink:#0F1A1F; --accent-soft:#163B45;
  --warm:#F0916A; --warm-soft:#3A251C;
  --good:#7ED3A2; --good-soft:#173A2A; --bad:#F2938B; --bad-soft:#3D211F;
  --shadow:0 2px 10px rgba(0,0,0,.35);
}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
}
.wrap{max-width:860px;margin:0 auto;padding:0 20px 90px}
.es{font-style:italic}

/* ---------- header ---------- */
header{background:var(--surface);border-bottom:1px solid var(--line)}
.head-inner{max-width:860px;margin:0 auto;padding:16px 20px 14px}
.head-row{display:flex;align-items:center;gap:14px}
.brand{
  appearance:none;background:none;border:0;padding:0;cursor:pointer;
  display:inline-flex;align-items:center;gap:9px;
  font-family:var(--sans);font-weight:800;font-size:22px;letter-spacing:-.02em;color:var(--accent);line-height:1;
}
.brand svg{width:26px;height:26px;flex:none}
.brand:hover{filter:brightness(1.12)}
.brand:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.report{
  margin-left:auto;display:inline-flex;align-items:center;gap:7px;text-decoration:none;
  font-size:13px;font-weight:600;color:var(--muted);
  border:1px solid var(--line);border-radius:99px;padding:7px 13px;background:var(--surface-2);white-space:nowrap;
}
.report:hover{color:var(--warm);border-color:var(--warm)}
.report:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.report svg{width:13px;height:13px;flex:none}
.set-head{margin-top:14px}
.back{
  appearance:none;background:none;border:0;cursor:pointer;padding:0;margin:0 0 8px;
  font-family:var(--sans);font-size:13.5px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:5px;
}
.back:hover{color:var(--accent)}
.back:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.set-tag{font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--warm);font-weight:700;margin:0 0 4px}
h1{font-weight:800;font-size:25px;line-height:1.15;margin:0 0 4px;letter-spacing:-.01em;text-wrap:balance}
.sub{margin:0 0 14px;color:var(--muted);font-size:14px}
.tabs{display:inline-flex;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:4px;flex-wrap:wrap}
.tab{
  appearance:none;border:0;background:none;cursor:pointer;display:inline-flex;align-items:center;gap:7px;
  font-family:var(--sans);font-size:14px;font-weight:600;color:var(--muted);
  padding:8px 14px;border-radius:9px;
}
.tab svg{width:15px;height:15px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- controls ---------- */
#controls{margin:18px 0 14px}
.bar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-bottom:10px}
.field{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.group{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  appearance:none;cursor:pointer;font-family:var(--sans);font-size:13px;font-weight:600;color:var(--muted);
  background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:6px 13px;white-space:nowrap;
}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chip .n{opacity:.6;font-weight:500;margin-left:4px}
.mode-note{
  font-size:13.5px;color:var(--muted);margin:0 0 16px;
  display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;
}
.mode-note b{color:var(--ink);font-weight:700}

/* ---------- shared ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:26px}
.btn{
  appearance:none;cursor:pointer;font-family:var(--sans);font-weight:700;font-size:15px;
  padding:11px 20px;border-radius:11px;border:1px solid var(--accent);
  background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;gap:8px;
}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--surface);color:var(--muted);border-color:var(--line)}
.btn.ghost:hover{color:var(--ink);border-color:var(--muted);filter:none}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.hint{font-size:13px;color:var(--muted);margin-top:14px}

/* ---------- home ---------- */
.hero{padding:26px 0 18px}
.hero h2{font-size:30px;font-weight:800;margin:0 0 6px;letter-spacing:-.02em;text-wrap:balance;line-height:1.15}
.hero p{margin:0;color:var(--muted);font-size:16px;max-width:36em}
.home-grid{display:grid;grid-template-columns:1fr;gap:16px}
.setcard{
  position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:22px 22px 20px;display:flex;flex-direction:column;gap:14px;overflow:hidden;
}
.setcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
.setcard.featured::before{background:var(--warm)}
.setcard .top{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.setcard h2{font-weight:800;font-size:20px;margin:0;line-height:1.25;text-wrap:balance;flex:1;min-width:220px}
.badge{
  font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  color:var(--warm);background:var(--warm-soft);border-radius:99px;padding:5px 11px;white-space:nowrap;
}
.setcard .tag{font-size:13px;color:var(--muted);margin:-8px 0 0}
.setcard .parts{display:flex;gap:7px;flex-wrap:wrap}
.pill{font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:99px;padding:4px 11px}
.pill.quiz{color:var(--warm);background:var(--warm-soft)}
.pill.gram{color:var(--good);background:var(--good-soft)}
.verdict .why{color:var(--accent);font-weight:600}
.deftable .alt{font-weight:400;color:var(--muted);font-size:13px}
.setcard .go{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.go button{
  appearance:none;cursor:pointer;font-family:var(--sans);font-size:14px;font-weight:700;
  color:var(--ink);background:var(--surface-2);border:1px solid var(--line);
  border-radius:11px;padding:11px 15px;display:inline-flex;align-items:center;gap:8px;
}
.go button svg{width:16px;height:16px;color:var(--accent)}
.go button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.go button.primary svg{color:var(--accent-ink)}
.go button:hover{border-color:var(--accent);filter:brightness(1.04)}
.go button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tip{
  margin-top:18px;background:var(--warm-soft);border:1px solid transparent;border-radius:14px;padding:13px 16px;
  font-size:14px;color:var(--ink);display:flex;gap:10px;align-items:flex-start;
}
.tip svg{width:18px;height:18px;flex:none;color:var(--warm);margin-top:2px}
.tip b{font-weight:700}

/* ---------- progress ---------- */
.progress{margin-bottom:16px}
.roundline{display:flex;gap:10px;align-items:center;margin-bottom:9px;font-size:13px;color:var(--muted)}
.roundline .roundno{font-weight:700;color:var(--ink);white-space:nowrap}
.roundline .roundno span{color:var(--muted);font-weight:500}
.roundline .phase{
  font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  padding:4px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line);white-space:nowrap;
}
.roundline .phase.type{color:var(--accent);background:var(--accent-soft);border-color:transparent}
.roundline .pips{display:flex;gap:5px}
.roundline .pips i{width:18px;height:6px;border-radius:99px;background:var(--line);display:block;transition:background .2s ease}
.roundline .pips i.on{background:var(--good)}
.meter{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.meter > i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s ease}
.progress .stats{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:7px;font-variant-numeric:tabular-nums}

/* ---------- question ---------- */
.prompt-kind{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:10px}
.prompt{font-size:29px;line-height:1.2;margin:0 0 22px;text-wrap:balance}
.prompt.term{font-style:italic;font-weight:700}
.prompt.def{font-size:21px;line-height:1.35;max-width:32em;font-weight:500}
.prompt.def.spanish{font-style:italic}
.prompt.ask{font-size:23px;line-height:1.3;max-width:26em;font-weight:700}
.prompt.fill{font-style:normal;font-weight:500}
.q-text.fill{font-style:normal}
.blank{display:inline-block;min-width:5.5em;height:1em;border-bottom:2.5px solid var(--accent);vertical-align:baseline;margin:0 .15em;border-radius:1px}
.tile .blank{min-width:3.5em;border-bottom-width:2px}
.wb-def .blank{min-width:4.5em}
.opts{display:grid;gap:9px}
.opt{
  display:flex;gap:13px;align-items:center;text-align:left;width:100%;
  appearance:none;cursor:pointer;font-family:var(--sans);font-size:16px;color:var(--ink);
  background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;
  transition:background .12s ease,border-color .12s ease,transform .08s ease;
}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt:active:not(:disabled){transform:scale(.995)}
.opt:disabled{cursor:default}
.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opt .num{
  flex:none;width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);
}
.opt.correct{background:var(--good-soft);border-color:var(--good);color:var(--good);font-weight:700}
.opt.correct .num{background:var(--good);color:#fff;border-color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.opt.wrong .num{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt.chosen{border-color:var(--accent);background:var(--accent-soft)}
.opt.chosen .num{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.typebox{display:flex;gap:10px;flex-wrap:wrap}
input[type="text"]{
  flex:1;min-width:220px;font-family:var(--sans);font-size:17px;color:var(--ink);
  background:var(--surface-2);border:1.5px solid var(--line);border-radius:11px;padding:12px 14px;
}
input[type="text"].spanish{font-style:italic}
input[type="text"]:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}

.verdict{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);font-size:15px}
.verdict b{font-weight:800;font-size:16px}
.verdict.ok b{color:var(--good)}
.verdict.no b{color:var(--bad)}
.verdict .answer{color:var(--ink);display:block;margin-top:5px}
.verdict .gloss{color:var(--muted);display:block;margin-top:3px;font-size:14px}

/* ---------- test ---------- */
.q{border-bottom:1px solid var(--line);padding:22px 0}
.q:first-of-type{padding-top:4px}
.q:last-of-type{border-bottom:0}
.q-head{display:flex;gap:12px;align-items:baseline;margin-bottom:14px}
.q-num{font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;min-width:26px}
.q-text{font-size:19px;line-height:1.35;margin:0}
.q-text.term{font-style:italic;font-weight:700;font-size:21px}
.q-text.def.spanish{font-style:italic}
.q-text.ask{font-size:18px;line-height:1.4;font-weight:700}
.q .opts{margin-left:38px}
.q.marked-wrong .q-num{color:var(--bad)}
.q.marked-ok .q-num{color:var(--good)}
.q .gloss{margin:10px 0 0 38px;font-size:13px;color:var(--muted)}
.score{
  display:flex;gap:22px;align-items:center;flex-wrap:wrap;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:18px 22px;margin-bottom:18px;
}
.score .big{font-weight:800;font-size:40px;line-height:1;font-variant-numeric:tabular-nums;color:var(--accent)}
.score .detail{color:var(--muted);font-size:14.5px}
.score .detail b{color:var(--ink);display:block;font-size:16px;font-weight:700}

/* ---------- match ---------- */
.match-bar{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-bottom:14px;font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.match-bar .clock{font-weight:800;font-size:28px;color:var(--ink);line-height:1}
.match-bar .pen{color:var(--bad);font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:10px}
.tile{
  appearance:none;cursor:pointer;font-family:var(--sans);font-size:14.5px;line-height:1.35;
  color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:14px;
  padding:15px 14px;min-height:104px;text-align:left;display:flex;align-items:center;
  box-shadow:var(--shadow);transition:transform .12s ease,opacity .18s ease,background .12s ease,border-color .12s ease;
}
.tile.word{font-style:italic;font-weight:700;font-size:17px}
.tile.esdef{font-style:italic}
.tile:hover:not(:disabled){border-color:var(--accent)}
.tile:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tile.sel{border-color:var(--accent);background:var(--accent-soft);transform:scale(.98)}
.tile.hit{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.tile.miss{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.tile.gone{opacity:0;pointer-events:none}
.match-done{text-align:center;padding:22px 0}
.match-done .time{font-weight:800;font-size:54px;line-height:1;margin:0 0 4px;font-variant-numeric:tabular-nums;color:var(--accent)}
.match-done p{color:var(--muted);margin:0 0 20px}

/* ---------- word bank ---------- */
.wb-row{display:grid;grid-template-columns:26px 168px 1fr;gap:8px 14px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.wb-row:last-child{border-bottom:0}
.wb-num{font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.wb-box{
  min-height:46px;border:2px dashed var(--line);border-radius:11px;
  display:flex;align-items:center;justify-content:center;padding:6px 10px;
  font-size:15.5px;font-style:italic;font-weight:700;color:var(--muted);
  cursor:pointer;text-align:center;line-height:1.2;transition:border-color .12s ease,background .12s ease;
}
.wb-box:hover{border-color:var(--accent)}
.wb-box:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wb-box.filled{border-style:solid;border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.wb-box.over{border-color:var(--accent);background:var(--accent-soft)}
.wb-box.correct{border-color:var(--good);background:var(--good-soft);color:var(--good);cursor:default}
.wb-box.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad);cursor:default}
.wb-def{margin:0;font-size:15px;line-height:1.4}
.wb-def.spanish{font-style:italic}
.wb-fix{grid-column:2/-1;margin:0;font-size:13px;color:var(--muted)}
.wb-fix .es{color:var(--good);font-weight:700}
.wb-bank{position:sticky;bottom:12px;margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:13px 15px}
.wb-bank-head{display:flex;align-items:baseline;gap:12px;margin-bottom:10px}
.wb-hint{font-size:12px;color:var(--warm);font-weight:700}
.wb-count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin-left:auto}
.wb-words{display:flex;flex-wrap:wrap;gap:7px;max-height:168px;overflow-y:auto}
.wb-word{
  appearance:none;cursor:grab;font-family:var(--sans);font-size:14.5px;font-style:italic;font-weight:700;
  color:var(--ink);background:var(--surface-2);border:1.5px solid var(--line);border-radius:10px;padding:8px 13px;
}
.wb-word:hover{border-color:var(--accent);color:var(--accent)}
.wb-word:active{cursor:grabbing}
.wb-word.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.wb-word:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wb-empty{font-size:13px;color:var(--muted)}

/* ---------- examen completo ---------- */
.full-part{margin-bottom:18px}
.full-part-head{margin-bottom:6px}
.full-part-head h2{font-size:20px;font-weight:800;margin:6px 0 4px}
.full-part-head p{margin:0 0 6px;color:var(--muted);font-size:14px}
.full-badge{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--warm);background:var(--warm-soft);border-radius:99px;padding:4px 10px}
.full-block{padding-top:16px;margin-top:10px;border-top:1px solid var(--line)}
.full-h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800;margin:0 0 10px}
.full-h3 span{font-weight:500;letter-spacing:0;text-transform:none}
.wb-bank.inblock{position:sticky;top:8px;bottom:auto;margin:0 0 6px;z-index:2}
.full-footer{margin-top:6px;margin-bottom:10px}

/* ---------- list ---------- */
.listsec + .listsec{margin-top:28px}
.listsec h2{font-weight:800;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.vocab{display:grid;grid-template-columns:1fr 1fr;gap:0 30px}
.vocab.one{grid-template-columns:1fr}
.vocab .item{display:flex;justify-content:space-between;gap:14px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.vocab .item .en{color:var(--muted);text-align:right;font-size:14px}
.vocab .item .qa{font-size:14px;line-height:1.35;flex:1}
.vocab.one .item .en{color:var(--accent);font-weight:600;flex:none;max-width:45%}
.deftable .row2{padding:11px 0;border-bottom:1px solid var(--line)}
.deftable .row2:last-child{border-bottom:0}
.deftable .t{font-style:italic;font-weight:700;font-size:16px}
.deftable .t .en{font-style:normal;font-weight:400;color:var(--muted);font-size:14px;margin-left:9px}
.deftable .d{font-size:14px;color:var(--muted);margin-top:3px}
.deftable .d.spanish{font-style:italic}
.deftable .qq{font-size:15px;font-weight:700;line-height:1.35}

SETS.forEach(set=>{

    g.items = g.terms.map((t,i)=>{
      const id = set.id+"-"+g.id+i, base = {id, group:g.id, section:g.section||null};
      if(g.kind==="quiz") return {...base, kind:"quiz", q:t[0], a:t[1], opts:t.slice(1), es:t[1], en:t[0]};
      if(g.kind==="gram") return {...base, kind:"gram", q:t[0], a:t[1], opts:t.slice(1,5), why:t[5]||"", alt:(t[6]||"").split("|").filter(Boolean),
                                  es:t[1], en:t[0], fb:t[0], de:t[5]||"", ds:t[5]||""};
      return {...base, kind:"vocab", es:t[0], en:t[1], de:t[2], ds:t[3], fb:t[4]||null};
    });
  });
  set.all = set.groups.reduce((a,g)=>a.concat(g.items),[]);
  set.hasFill = set.all.some(t=>(t.kind==="vocab" && t.fb) || t.kind==="gram");
  set.nVocab = set.all.filter(t=>t.kind==="vocab").length;
  set.nGram  = set.all.filter(t=>t.kind==="gram").length;
  set.nQuiz  = set.all.filter(t=>t.kind==="quiz").length;
  set.nDrill = set.nVocab + set.nGram;
});

/* put the word back into its sentence: drop the article when the sentence already supplies a determiner */
const DETS = new Set("un una unos unas el la los las mucho mucha muchos muchas gran breve cada aquel aquella su sus mi este esta poco poca tanto tanta de con por sin".split(" "));
function fillSentence(item){
  let sent = item.fb || "";
  if(item.kind==="gram") sent = sent.replace(/\s*\([^)]*\)/g,"");
  let word = item.es.split(",")[0].replace(/\s*\(.*?\)/,"").replace(/\.{2,}$/,"").trim();
  const m = sent.match(/(\S+)\s+_{2,}/);
  const prev = m ? m[1].toLowerCase().replace(/[^a-záéíóúñü]/g,"") : "";
  if(DETS.has(prev)) word = word.replace(/^(el|la|los|las)\s+/i,"");
  if(/^_{2,}/.test(sent)) word = word.charAt(0).toUpperCase()+word.slice(1);
  return sent.replace(/_{2,}/, word);
}
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const pick = a => a[Math.floor(Math.random()*a.length)];

function norm(s){
  return String(s).toLowerCase()
    .normalize("NFD").replace(/[̀-ͯ]/g,"")
    .replace(/\(.*?\)/g," ")
    .replace(/[^a-z\s]/g," ")
    .replace(/\s+/g," ").trim()
    .replace(/^(the|to|a|an|el|la|los|las)\s+/,"");
}
function accepts(answer, input){
  const given = norm(input);
  if(!given) return false;
  const parts = answer.split(/[,\/]/).map(norm).filter(Boolean);
  parts.push(norm(answer), norm(answer.replace(/,/g," ")));
  return parts.includes(given);
}
/* grammar answers: accents count. "ok", "accent" (right letters, tilde wrong or missing) or "no". */
function checkGram(item, input){
  const clean = s => String(s).toLowerCase().replace(/\s+/g," ").trim();
  const strip = s => clean(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  const cands = [item.a].concat(item.alt||[]);
  const g = clean(input);
  if(!g) return "no";
  if(cands.some(c=>clean(c)===g)) return "ok";
  if(cands.some(c=>strip(c)===strip(g))) return "accent";
  return "no";
}

          label:"Frases", mcLabel:"Completa la frase", typeLabel:"Escribe la palabra que falta",
          note:"A sentence from the story with a blank &rarr; the word that completes it. This is the test format.", ph:"la palabra que falta…"}
};
const MATCH_DIFF = {
  easy:{label:"Fácil", key:"de", tileClass:"", note:"Match each Spanish word to its English definition."},
  hard:{label:"Difícil", key:"ds", tileClass:"esdef", note:"Match each Spanish definition to its Spanish word. No English."},
  fill:{label:"Frases", key:"fb", tileClass:"esdef", note:"Match each sentence to the word that fills its blank."}
};

function makeMC(term, pool, diff){
  if(term.opts) return {term, diff, kind:"mc", prompt:term.q, answer:term.a, options:shuffle(term.opts)};
  const d = DIFF[diff], key = d.answerKey;
  const correct = term[key];
  const parts = a => a.split(/[,;\/]/).map(norm).filter(Boolean);
  const taken = new Set(parts(correct).concat([norm(correct)]));
  const opts = [correct];
  const vocab = pool.filter(t=>t.kind==="vocab" && t.id!==term.id);
  const sameGroup = shuffle(vocab.filter(t=>t.group===term.group));
  const rest = shuffle(vocab.filter(t=>t.group!==term.group));
  for(const o of sameGroup.concat(rest)){
    if(opts.length>=4) break;
    const p = parts(o[key]).concat([norm(o[key])]);
    if(p.some(x=>taken.has(x))) continue;
    p.forEach(x=>taken.add(x));
    opts.push(o[key]);
  }
  return {term, diff, kind:"mc", prompt:term[d.promptKey], answer:correct, options:shuffle(opts)};
}
function makeType(term, diff){
  if(term.kind==="gram") return {term, diff, kind:"type", prompt:term.q, answer:term.a};
  const d = DIFF[diff];
  return {term, diff, kind:"type", prompt:term[d.promptKey], answer:term[d.answerKey]};
}
/* how a prompt / option should be styled for a given item */
const promptClass = (item, diff) => item.kind==="quiz" ? "ask" : item.kind==="gram" ? "def spanish fill" : DIFF[diff].promptStyle;
const optClass    = (item, diff) => item.kind==="quiz" ? "" : item.kind==="gram" ? "es" : (DIFF[diff].answerLang==="es" ? "es" : "");

/* ---------- state ---------- */
const state = { view:"home", mode:"learn", setId:SETS[0].id, section:"all", group:"all", diff:"easy", matchDiff:"easy", testLen:10 };
let learn = null, test = null, match = null, wb = null, matchTimer = null, bestTimes = {};

const curSet = () => SETS.find(s=>s.id===state.setId);
function curGroups(){
  const set = curSet();
  let gs = set.groups;
  if(set.sections && state.section!=="all") gs = gs.filter(g=>g.section===state.section);
  if(state.group!=="all") gs = gs.filter(g=>g.id===state.group);
  return gs;
}
const curPool   = () => curGroups().reduce((a,g)=>a.concat(g.items),[]);
const vocabPool = () => curPool().filter(t=>t.kind!=="quiz");   /* anything drillable: words or verb blanks */
const hasVocab  = () => vocabPool().length>0;
const realVocab = () => curPool().some(t=>t.kind==="vocab");     /* true words, which have Nivel */
const allQuiz   = () => !hasVocab();

/* ---------- LEARN ----------
   Rounds of 5. Multiple choice until all five are right, then the vocab items
   come back as typing. Quiz questions have nothing to type, so they skip that
   pass. A miss goes to the back of the queue. --------------------------------- */
const ROUND_SIZE = 5;
function startLearn(){
  const pool = curPool();
  const order = shuffle(pool);
  const rounds = [];
  for(let i=0;i<order.length;i+=ROUND_SIZE) rounds.push(order.slice(i,i+ROUND_SIZE));
  learn = { pool, diff:state.diff, rounds, roundIdx:0, phase:"mc", queue:[],
            current:null, step:"ask", mastered:new Set(), missed:new Set(), asked:0 };
  startPhase("mc");
}
const curRound = () => learn.rounds[learn.roundIdx] || [];
function startPhase(kind){
  learn.phase = kind;
  const items = kind==="type" ? curRound().filter(t=>t.kind!=="quiz") : curRound();
  learn.queue = shuffle(items).map(t=>t.id);
  nextLearn();
}
function nextLearn(){
  if(!learn.queue.length){
    if(learn.phase==="mc" && curRound().some(t=>t.kind!=="quiz")){ startPhase("type"); return; }
    curRound().forEach(t=>learn.mastered.add(t.id));
    if(learn.roundIdx >= learn.rounds.length-1) renderLearnDone();
    else renderRoundDone();
    return;
  }
  const term = learn.pool.find(t=>t.id===learn.queue[0]);
  learn.current = learn.phase==="mc" ? makeMC(term, learn.pool, learn.diff) : makeType(term, learn.diff);
  learn.step = "ask";
  renderLearn();
}
function learnAnswer(correct, note){
  learn.note = note || null;
  learn.asked++;
  if(correct) learn.queue.shift();
  else { learn.missed.add(learn.queue[0]); learn.queue.push(learn.queue.shift()); }
  learn.step = correct ? "right" : "wrong";
  renderLearn();
}
function renderLearn(){
  const q = learn.current, item = q.term, d = DIFF[learn.diff];
  const size = curRound().length;
  const phaseSize = learn.phase==="type" ? curRound().filter(t=>t.kind!=="quiz").length : size;
  const doneInPhase = phaseSize - learn.queue.length;
  const phaseName = learn.phase==="mc" ? "Opci&oacute;n m&uacute;ltiple" : "Escribir";
  const isQ = item.kind==="quiz", isG = item.kind==="gram";
  const kindLabel = isQ ? "Escoge la respuesta correcta" : isG ? (q.kind==="mc" ? "Escoge la forma correcta" : "Escribe la forma correcta (con acentos)") : (q.kind==="mc" ? d.mcLabel : d.typeLabel);

  let body = "";
  if(learn.step==="ask"){
    if(q.kind==="mc"){
      body = `<div class="opts">` + q.options.map((o,i)=>
        `<button class="opt" data-opt="${esc(o)}"><span class="num">${i+1}</span><span class="${optClass(item,learn.diff)}">${esc(o)}</span></button>`
      ).join("") + `</div>`;
    }else{
      body = `<form class="typebox" id="typeForm">
          <input type="text" id="typeInput" class="${isG||d.answerLang==='es'?'spanish':''}" autocomplete="off"
                 autocapitalize="off" spellcheck="false" placeholder="${isG?'la forma del verbo…':d.ph}">
          <button class="btn" type="submit">Check</button>
          <button class="btn ghost" type="button" id="dunno">No s&eacute;</button>
        </form>`;
    }
  }
  let verdict = "";
  if(learn.step!=="ask"){
    const ok = learn.step==="right";
    verdict = `<div class="verdict ${ok?'ok':'no'}">
        <b>${ok?'&#10003; ¡Correcto!':learn.note==="accent"?'&#10007; Casi &mdash; revisa el acento':'&#10007; Casi&hellip;'}</b>
        <span class="answer">${isQ ? esc(item.a) : isG ? `<span class="es">${esc(item.a)}</span>${item.alt&&item.alt.length?` <span class="gloss" style="display:inline">(también: ${esc(item.alt.join(", "))})</span>`:""}` : `<span class="es">${esc(item.es)}</span> &mdash; ${esc(item.en)}`}</span>
        ${isG ? `<span class="gloss">${esc(fillSentence(item))}</span><span class="gloss why">${esc(item.why)}</span>` : ""}
        ${!isQ && !isG && learn.diff==="fill" ? `<span class="gloss">${esc(fillSentence(item))}</span>` : ""}
        ${!isQ && (learn.diff==="medium"||learn.diff==="hard") ? `<span class="gloss">${esc(item[learn.diff==="hard"?"ds":"de"])}</span>` : ""}
        ${!ok ? `<span class="gloss">It&rsquo;ll come back later in this round.</span>` : ""}
      </div>
      <div class="row" style="margin-top:16px"><button class="btn" id="nextBtn">Continuar</button>
      <span class="hint" style="margin:0">press Enter</span></div>`;
  }
  panel.innerHTML = `
    <div class="progress">
      <div class="roundline">
        <span class="roundno">Ronda ${learn.roundIdx+1} <span>de ${learn.rounds.length}</span></span>
        <span class="phase ${learn.phase}">${phaseName}</span>
        <span class="spacer"></span>
        <span class="pips">${Array.from({length:phaseSize},(_,i)=>`<i class="${i<doneInPhase?'on':''}"></i>`).join("")}</span>
      </div>
      <div class="meter"><i style="width:${Math.round(learn.mastered.size/learn.pool.length*100)}%"></i></div>
      <div class="stats"><span>${learn.mastered.size} / ${learn.pool.length} dominadas</span><span>${learn.asked} preguntas</span></div>
    </div>
    <div class="card">
      <div class="prompt-kind">${kindLabel}</div>
      <p class="prompt ${promptClass(item,learn.diff)}">${fmt(q.prompt)}</p>
      ${body}${verdict}
    </div>
    ${learn.step==="ask"&&q.kind==="mc"?'<p class="hint">Tip: press 1&ndash;4 to answer.</p>':''}`;
  updateReportLink();

  if(learn.step==="ask"){
    if(q.kind==="mc"){
      panel.querySelectorAll(".opt").forEach(b=>{
        b.addEventListener("click",()=>{
          const ok = b.dataset.opt===q.answer;
          panel.querySelectorAll(".opt").forEach(x=>{
            x.disabled = true;
            if(x.dataset.opt===q.answer) x.classList.add("correct");
            else if(x===b) x.classList.add("wrong");
          });
          setTimeout(()=>learnAnswer(ok), ok?320:560);
        });
      });
    }else{
      const inp = $("#typeInput"); inp.focus();
      $("#typeForm").addEventListener("submit",e=>{
        e.preventDefault();
        if(isG){ const r = checkGram(item, inp.value); learnAnswer(r==="ok", r==="accent"?"accent":null); }
        else learnAnswer(accepts(q.answer, inp.value));
      });
      $("#dunno").addEventListener("click",()=>learnAnswer(false));
    }
  }else{
    $("#nextBtn").focus();
    $("#nextBtn").addEventListener("click", nextLearn);
  }
}
function itemRow(t){
  return t.kind==="quiz" || t.kind==="gram"
    ? `<div class="item"><span class="qa">${t.kind==="gram"?fmt(t.q):esc(t.q)}</span><span class="en">${esc(t.a)}</span></div>`
    : `<div class="item"><span class="es">${esc(t.es)}</span><span class="en">${esc(t.en)}</span></div>`;
}
function renderRoundDone(){
  const terms = curRound();
  const left = learn.rounds.length-learn.roundIdx-1;
  const anyQuiz = terms.some(t=>t.kind!=="vocab");
  panel.innerHTML = `<div class="card done">
    <p class="big">¡Ronda ${learn.roundIdx+1} lista!</p>

function renderLearnDone(){
  const missed = [...learn.missed].map(id=>learn.pool.find(t=>t.id===id)).filter(Boolean);

      <div class="vocab${missed.some(t=>t.kind!=="vocab")?" one":""}">${missed.map(itemRow).join("")}</div></div>`:""}
  </div>`;
  updateReportLink();
  $("#again").addEventListener("click", startLearn);
  $("#toTest").addEventListener("click", ()=>setMode("test"));

/* ---------- MATCH (vocab only) ---------- */
function startMatch(){
  const pool = vocabPool();
  if(pool.length<2){ panel.innerHTML = `<div class="card empty">Emparejar needs vocabulary words &mdash; pick a part with words in it.</div>`; return; }
  const n = Math.min(6, pool.length);
  const terms = shuffle(pool).slice(0,n);
  const key = MATCH_DIFF[state.matchDiff].key;
  const tiles = shuffle(terms.flatMap(t=>[
    {tid:t.id+"-w", term:t, text:t.es, side:"word"},
    {tid:t.id+"-d", term:t, text:t[key], side:"def"}
  ]));
  match = { terms, tiles, matched:new Set(), sel:null, started:0, elapsed:0, penalty:0, done:false, busy:false };
  renderMatch();
}
function matchClock(){
  if(!match || match.done) return 0;
  return (match.started ? (Date.now()-match.started)/1000 : 0) + match.penalty;
}
function renderMatch(){
  const m = MATCH_DIFF[state.matchDiff];
  const key = `${state.setId}|${state.section}|${state.group}|${state.matchDiff}`;
  if(match.done){
    const best = bestTimes[key];
    panel.innerHTML = `<div class="card match-done">
      <p class="time">${match.elapsed.toFixed(1)}s</p>
      <p>${match.terms.length} pairs${match.penalty?` &middot; +${match.penalty}s in penalties`:" &middot; sin errores"}${best!==undefined?` &middot; best ${best.toFixed(1)}s`:""}</p>
      <div class="row" style="justify-content:center">
        <button class="btn" id="againMatch">Otra vez</button>
        <button class="btn ghost" id="toTestM">Ir al Examen</button>
      </div></div>`;
    $("#againMatch").addEventListener("click", startMatch);
    $("#toTestM").addEventListener("click", ()=>setMode("test"));
    updateReportLink();
    return;
  }
  panel.innerHTML = `
    <div class="match-bar">
      <span class="clock" id="clock">0.0s</span>
      <span id="pairCount">${match.matched.size} / ${match.terms.length} pairs</span>
      ${match.penalty?`<span class="pen">+${match.penalty}s penalty</span>`:""}
      <span class="spacer"></span>
      <button class="btn ghost" id="resetMatch" style="padding:7px 13px;font-size:14px">Barajar</button>
    </div>
    <div class="tiles">${match.tiles.map(t=>
      `<button class="tile ${t.side==='word'?'word':m.tileClass}" data-tid="${t.tid}" ${match.matched.has(t.term.id)?'disabled':''}>${fmt(t.text)}</button>`).join("")}</div>`;
  updateReportLink();
  $("#resetMatch").addEventListener("click", startMatch);
  panel.querySelectorAll(".tile").forEach(b=>b.addEventListener("click",()=>tileClick(b)));
  clearInterval(matchTimer);
  matchTimer = setInterval(()=>{
    const c = $("#clock");
    if(!c || !match || match.done){ clearInterval(matchTimer); return; }
    c.textContent = matchClock().toFixed(1)+"s";
  }, 100);
}
function tileClick(btn){
  if(match.busy) return;
  const tile = match.tiles.find(t=>t.tid===btn.dataset.tid);
  if(!tile || match.matched.has(tile.term.id)) return;
  if(!match.started) match.started = Date.now();
  if(!match.sel){ match.sel = tile; btn.classList.add("sel"); return; }
  if(match.sel.tid===tile.tid){ match.sel=null; btn.classList.remove("sel"); return; }
  const first = panel.querySelector(`.tile[data-tid="${match.sel.tid}"]`);
  if(match.sel.term.id===tile.term.id && match.sel.side!==tile.side){
    match.matched.add(tile.term.id);
    [first,btn].forEach(el=>{ el.classList.remove("sel"); el.classList.add("hit"); el.disabled=true; });
    match.sel = null;
    setTimeout(()=>{
      [first,btn].forEach(el=>el.classList.add("gone"));
      if(match.matched.size===match.terms.length){
        match.elapsed = matchClock(); match.done = true; clearInterval(matchTimer);
        const key = `${state.setId}|${state.section}|${state.group}|${state.matchDiff}`;
        if(bestTimes[key]===undefined || match.elapsed<bestTimes[key]) bestTimes[key]=match.elapsed;
        setTimeout(renderMatch, 260);
      }else{
        const c = $("#pairCount"); if(c) c.textContent = `${match.matched.size} / ${match.terms.length} pairs`;
      }
    }, 180);
  }else{
    match.busy = true; match.penalty += 1;
    [first,btn].forEach(el=>{ el.classList.remove("sel"); el.classList.add("miss"); });
    setTimeout(()=>{
      [first,btn].forEach(el=>el.classList.remove("miss"));
      match.sel = null; match.busy = false;
      const pen = panel.querySelector(".match-bar .pen");
      if(pen) pen.textContent = `+${match.penalty}s penalty`;
      else{
        const sp = panel.querySelector(".match-bar .spacer");
        if(sp){ const s=document.createElement("span"); s.className="pen"; s.textContent=`+${match.penalty}s penalty`; sp.parentNode.insertBefore(s,sp); }
      }
    }, 420);
  }
}

/* ---------- WORD BANK (vocab only) ---------- */
const WB_LEN = 15, WB_DECOYS = 5;
const WB_PROMPT = {easy:"en", medium:"de", hard:"ds", fill:"fb"};
const WB_NOTE = {
  easy:"English meaning on each row &mdash; drop in the Spanish word.",
  medium:"English definition on each row &mdash; drop in the Spanish word.",
  hard:"Definici&oacute;n en espa&ntilde;ol &mdash; arrastra la palabra correcta. No English.",
  fill:"Frases del cuento con un hueco &mdash; arrastra la palabra que falta. Exactly the test format."
};
function startWordbank(){
  const pool = vocabPool();
  if(pool.length<2){ panel.innerHTML = `<div class="card empty">Banco needs vocabulary words &mdash; pick a part with words in it.</div>`; return; }
  const n = Math.min(WB_LEN, pool.length);
  const shuffled = shuffle(pool);
  const questions = shuffled.slice(0,n);
  const decoys = shuffled.slice(n, n + Math.min(WB_DECOYS, Math.max(0, pool.length - n)));
  const bankAll = shuffle(questions.concat(decoys)).map(t=>t.id);
  wb = { pool, diff:state.diff, questions, decoys:decoys.length, bankAll, bank:bankAll.slice(), placed:{}, selected:null, graded:false };
  renderWordbank();
}
function wbPlace(qi, termId){
  Object.keys(wb.placed).forEach(k=>{ if(wb.placed[k]===termId) delete wb.placed[k]; });
  const displaced = wb.placed[qi];
  wb.placed[qi] = termId;
  wb.bank = wb.bank.filter(id=>id!==termId);
  if(displaced && displaced!==termId) wb.bank.push(displaced);
  wb.selected = null;
  renderWordbank();
}
function wbReturn(qi){
  const id = wb.placed[qi];
  if(!id) return;
  delete wb.placed[qi];
  if(!wb.bank.includes(id)) wb.bank.push(id);
  renderWordbank();
}
function renderWordbank(){
  const key = WB_PROMPT[wb.diff], spanish = wb.diff!=="easy" && wb.diff!=="medium";
  const byId = id => wb.pool.find(t=>t.id===id);
  const filled = Object.keys(wb.placed).length;
  let head = "";
  if(wb.graded){
    const right = wb.questions.filter((t,i)=>wb.placed[i]===t.id).length;
    head = `<div class="score">
      <span class="big">${Math.round(right/wb.questions.length*100)}%</span>
      <span class="detail"><b>${right} of ${wb.questions.length} correct</b>${right===wb.questions.length?"¡Perfecto!":"Wrong ones are marked below."}</span>
      <span class="spacer"></span>
      <span class="row"><button class="btn" id="wbNew">Otra hoja</button></span>
    </div>`;
  }
  const rows = wb.questions.map((t,i)=>{
    const placedId = wb.placed[i], placedTerm = placedId ? byId(placedId) : null;
    let cls = "wb-box" + (placedTerm ? " filled" : "");
    let inner = placedTerm ? esc(placedTerm.es) : "";
    if(wb.graded){ cls = "wb-box filled " + (placedId===t.id ? "correct" : "wrong"); if(!placedTerm) inner = "&mdash;"; }
    return `<div class="wb-row">
      <span class="wb-num">${i+1}.</span>
      <div class="${cls}" data-box="${i}" tabindex="0" role="button" aria-label="Respuesta ${i+1}">${inner}</div>
      <p class="wb-def ${spanish?"spanish":""}">${fmt(t[key])}</p>
      ${wb.graded && wb.placed[i]!==t.id ? `<p class="wb-fix">Correcta: <span class="es">${esc(t.es)}</span></p>` : ""}
    </div>`;
  }).join("");
  const bank = wb.graded ? "" : `
    <div class="wb-bank">
      <div class="wb-bank-head">
        <span class="label">Banco de palabras</span>
        ${wb.decoys?`<span class="wb-hint">${wb.decoys} won&rsquo;t be used</span>`:""}
        <span class="wb-count">${wb.bankAll.length} words &middot; ${wb.questions.length} are answers</span>
      </div>
      <div class="wb-words" id="wbWords">${
        wb.bank.length
          ? wb.bank.map(id=>`<button class="wb-word${wb.selected===id?" sel":""}" draggable="true" data-word="${id}">${esc(byId(id).es)}</button>`).join("")
          : `<span class="wb-empty">Every word is placed.</span>`
      }</div>
    </div>`;
  const footer = wb.graded ? "" : `
    <div class="row" style="margin-top:18px">
      <button class="btn" id="wbSubmit">Entregar</button>
      <button class="btn ghost" id="wbClear">Vaciar</button>
      <span class="hint" style="margin:0" id="wbCount">${filled} of ${wb.questions.length} filled</span>
    </div>`;
  panel.innerHTML = head + `<div class="card"><div class="wb-list">${rows}</div></div>` + bank + footer;
  updateReportLink();
  if(wb.graded){ $("#wbNew").addEventListener("click", startWordbank); return; }

  panel.querySelectorAll(".wb-word").forEach(w=>{
    w.addEventListener("click",()=>{ wb.selected = wb.selected===w.dataset.word ? null : w.dataset.word; renderWordbank(); });
    w.addEventListener("dragstart",e=>{ e.dataTransfer.setData("text/plain", w.dataset.word); e.dataTransfer.effectAllowed="move"; wb.selected = w.dataset.word; });
  });
  panel.querySelectorAll(".wb-box").forEach(box=>{
    const qi = +box.dataset.box;
    const activate = ()=>{ if(wb.selected) wbPlace(qi, wb.selected); else if(wb.placed[qi]) wbReturn(qi); };
    box.addEventListener("click", activate);
    box.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); activate(); }});
    box.addEventListener("dragover",e=>{ e.preventDefault(); box.classList.add("over"); });
    box.addEventListener("dragleave",()=>box.classList.remove("over"));
    box.addEventListener("drop",e=>{ e.preventDefault(); box.classList.remove("over"); const id=e.dataTransfer.getData("text/plain"); if(id) wbPlace(qi,id); });
  });
  const words = $("#wbWords");
  if(words){
    words.addEventListener("dragover",e=>e.preventDefault());
    words.addEventListener("drop",e=>{ e.preventDefault(); const id=e.dataTransfer.getData("text/plain"); const qi=Object.keys(wb.placed).find(k=>wb.placed[k]===id); if(qi!==undefined) wbReturn(+qi); });
  }
  $("#wbSubmit").addEventListener("click",()=>{
    const blanks = wb.questions.length - Object.keys(wb.placed).length;
    if(blanks>0 && !wbConfirm(blanks)) return;
    wb.graded = true; renderWordbank(); window.scrollTo({top:0,behavior:"smooth"});
  });
  $("#wbClear").addEventListener("click",()=>{ wb.placed={}; wb.selected=null; wb.bank=shuffle(wb.bankAll); renderWordbank(); });
}
let wbWarned = false;
function wbConfirm(blanks){
  if(wbWarned){ wbWarned=false; return true; }
  wbWarned = true;
  const c = $("#wbCount"); c.textContent = `${blanks} still empty — those count as wrong. Press Entregar again.`; c.style.color="var(--bad)";
  return false;
}

/* ---------- EXAMEN COMPLETO ----------
   The whole set in one sitting. Part 1: every vocabulary word as a sentence
   with a blank, in word-bank blocks of 15 (each bank carries 5 decoys).
   Part 2: every comprehension question as multiple choice. One grade. ------- */
const FULL_BLOCK = 15, FULL_DECOYS = 5;
let full = null;
function startFull(){
  const set = curSet();
  const vkey = set.hasFill ? "fb" : "en";
  const vocab = shuffle(set.all.filter(t=>t.kind!=="quiz"));
  const blocks = [];
  for(let i=0;i<vocab.length;i+=FULL_BLOCK){
    const items = vocab.slice(i,i+FULL_BLOCK);
    const others = shuffle(vocab.filter(t=>!items.includes(t))).slice(0,FULL_DECOYS);
    const bankAll = shuffle(items.concat(others)).map(t=>t.id);
    blocks.push({items, decoys:others.length, bankAll, bank:bankAll.slice(), placed:{}});
  }
  const quiz = shuffle(set.all.filter(t=>t.kind==="quiz")).map(t=>makeMC(t,set.all,"easy"));
  full = { set, vkey, blocks, quiz, answers:{}, sel:null, graded:false, warned:false };
  renderFull();
}
const fullById = id => full.set.all.find(t=>t.id===id);
function fullBlockHTML(bi){
  const b = full.blocks[bi], spanish = full.vkey==="fb";
  const rows = b.items.map((t,i)=>{
    const pid = b.placed[i], pt = pid ? fullById(pid) : null;
    let cls = "wb-box" + (pt ? " filled" : "");
    let inner = pt ? esc(pt.es) : "";
    if(full.graded){ cls = "wb-box filled " + (pid===t.id ? "correct" : "wrong"); if(!pt) inner = "&mdash;"; }
    const n = full.blocks.slice(0,bi).reduce((a,x)=>a+x.items.length,0) + i + 1;
    return `<div class="wb-row">
      <span class="wb-num">${n}.</span>
      <div class="${cls}" data-block="${bi}" data-box="${i}" tabindex="0" role="button" aria-label="Respuesta ${n}">${inner}</div>
      <p class="wb-def ${spanish?"spanish":""}">${fmt(t[full.vkey])}</p>
      ${full.graded && pid!==t.id ? `<p class="wb-fix">Correcta: <span class="es">${esc(t.es)}</span></p>` : ""}
    </div>`;
  }).join("");
  const bank = full.graded ? "" : `
    <div class="wb-bank inblock">
      <div class="wb-bank-head">
        <span class="label">Banco ${bi+1}</span>
        ${b.decoys?`<span class="wb-hint">${b.decoys} won&rsquo;t be used</span>`:""}
        <span class="wb-count">${Object.keys(b.placed).length} / ${b.items.length} filled</span>
      </div>
      <div class="wb-words" data-bankof="${bi}">${
        b.bank.length
          ? b.bank.map(id=>`<button class="wb-word${full.sel&&full.sel.block===bi&&full.sel.word===id?" sel":""}" draggable="true" data-block="${bi}" data-word="${id}">${esc(fullById(id).es)}</button>`).join("")
          : `<span class="wb-empty">Every word is placed.</span>`
      }</div>
    </div>`;
  return `<section class="full-block" data-block="${bi}">
      <h3 class="full-h3">Bloque ${bi+1} <span>de ${full.blocks.length}</span></h3>
      ${bank}
      <div class="wb-list">${rows}</div>
    </section>`;
}
function renderFull(){
  const nV = full.blocks.reduce((a,b)=>a+b.items.length,0), nQ = full.quiz.length;
  let head = "";
  if(full.graded){
    const rV = full.blocks.reduce((a,b)=>a+b.items.filter((t,i)=>b.placed[i]===t.id).length,0);
    const rQ = full.quiz.filter((q,i)=>full.answers[i]===q.answer).length;
    const pct = Math.round((rV+rQ)/(nV+nQ)*100);
    head = `<div class="score">
      <span class="big">${pct}%</span>
      <span class="detail"><b>${rV+rQ} of ${nV+nQ} correct</b>${full.set.nVocab?"Vocabulario":"Verbos"} ${rV}/${nV} &middot; Preguntas ${rQ}/${nQ}</span>
      <span class="spacer"></span>
      <span class="row"><button class="btn" id="fullNew">Otra vez</button></span>
    </div>`;
  }
  const part1 = `<div class="card full-part">
      <div class="full-part-head"><span class="full-badge">Parte 1</span><h2>${full.set.nVocab?"Vocabulario":"Verbos"} &mdash; completa las frases</h2>
        <p>${nV} sentences in blocks of ${FULL_BLOCK}. Each block has its own bank; ${FULL_DECOYS} words in every bank are decoys.</p></div>
      ${full.blocks.map((b,i)=>fullBlockHTML(i)).join("")}
    </div>`;
  const part2 = `<div class="card full-part">
      <div class="full-part-head"><span class="full-badge">Parte 2</span><h2>Comprensi&oacute;n &mdash; escoge la respuesta</h2>
        <p>${nQ} questions on the story and the song. Multiple choice, one answer each.</p></div>
      ${full.quiz.map((q,i)=>{
        const chosen = full.answers[i];
        const cls = full.graded ? (chosen===q.answer?"marked-ok":"marked-wrong") : "";
        return `<div class="q ${cls}">
          <div class="q-head">
            <span class="q-num">${full.graded?(chosen===q.answer?"&#10003;":"&#10007;"):(nV+i+1)+"."}</span>
            <p class="q-text ask">${esc(q.prompt)}</p>
          </div>
          <div class="opts">${q.options.map((o,k)=>{
            let c=""; if(full.graded){ if(o===q.answer) c="correct"; else if(o===chosen) c="wrong"; } else if(o===chosen) c="chosen";
            return `<button class="opt ${c}" ${full.graded?"disabled":""} data-q="${i}" data-opt="${esc(o)}"><span class="num">${"ABCD"[k]}</span><span>${esc(o)}</span></button>`;
          }).join("")}</div>
        </div>`;
      }).join("")}
    </div>`;
  const footer = full.graded ? "" : `
    <div class="row full-footer">
      <button class="btn" id="fullSubmit">Entregar todo</button>
      <span class="hint" style="margin:0" id="fullCount">${fullFilled()} of ${nV+nQ} answered</span>
    </div>`;
  panel.innerHTML = head + part1 + part2 + footer;
  updateReportLink();
  if(full.graded){ $("#fullNew").addEventListener("click", startFull); return; }
  bindFullBlocks();
  panel.querySelectorAll(".opt:not(:disabled)").forEach(b=>b.addEventListener("click",()=>{
    const i = +b.dataset.q;
    full.answers[i] = b.dataset.opt;
    panel.querySelectorAll('.opt[data-q="'+i+'"]').forEach(x=>x.classList.remove("chosen"));
    b.classList.add("chosen");
    fullCountUpdate();
  }));
  $("#fullSubmit").addEventListener("click",()=>{
    const left = nV+nQ-fullFilled();
    if(left>0 && !full.warned){
      full.warned = true;
      const c = $("#fullCount"); c.textContent = `${left} still blank — those count as wrong. Press Entregar todo again.`; c.style.color="var(--bad)";
      return;
    }
    full.graded = true; renderFull(); window.scrollTo({top:0,behavior:"smooth"});
  });
}
function fullFilled(){
  return full.blocks.reduce((a,b)=>a+Object.keys(b.placed).length,0) + Object.keys(full.answers).length;
}
function fullCountUpdate(){
  const c = $("#fullCount"); if(!c) return;
  const n = full.blocks.reduce((a,b)=>a+b.items.length,0)+full.quiz.length;
  c.textContent = `${fullFilled()} of ${n} answered`; c.style.color=""; full.warned=false;
}
function fullRefreshBlock(bi){
  const old = panel.querySelector(`.full-block[data-block="${bi}"]`);
  if(!old) return;
  const tmp = document.createElement("div"); tmp.innerHTML = fullBlockHTML(bi);
  old.replaceWith(tmp.firstElementChild);
  bindFullBlocks(bi);
  fullCountUpdate();
}
function fullPlace(bi, qi, id){
  const b = full.blocks[bi];
  Object.keys(b.placed).forEach(k=>{ if(b.placed[k]===id) delete b.placed[k]; });
  const displaced = b.placed[qi];
  b.placed[qi] = id;
  b.bank = b.bank.filter(x=>x!==id);
  if(displaced && displaced!==id) b.bank.push(displaced);
  full.sel = null;
  fullRefreshBlock(bi);
}
function fullReturn(bi, qi){
  const b = full.blocks[bi], id = b.placed[qi];
  if(!id) return;
  delete b.placed[qi];
  if(!b.bank.includes(id)) b.bank.push(id);
  fullRefreshBlock(bi);
}
function bindFullBlocks(only){
  const scope = only===undefined ? panel : panel.querySelector(`.full-block[data-block="${only}"]`);
  if(!scope) return;
  scope.querySelectorAll(".wb-word").forEach(w=>{
    const bi = +w.dataset.block, id = w.dataset.word;
    w.addEventListener("click",()=>{
      const same = full.sel && full.sel.block===bi && full.sel.word===id;
      const prevBlock = full.sel ? full.sel.block : null;
      full.sel = same ? null : {block:bi, word:id};
      if(prevBlock!==null && prevBlock!==bi) fullRefreshBlock(prevBlock);
      fullRefreshBlock(bi);
    });
    w.addEventListener("dragstart",e=>{ e.dataTransfer.setData("text/plain", bi+"|"+id); e.dataTransfer.effectAllowed="move"; full.sel={block:bi, word:id}; });
  });
  scope.querySelectorAll(".wb-box").forEach(box=>{
    const bi = +box.dataset.block, qi = +box.dataset.box;
    const activate = ()=>{
      if(full.sel && full.sel.block===bi) fullPlace(bi, qi, full.sel.word);
      else if(full.blocks[bi].placed[qi]) fullReturn(bi, qi);
    };
    box.addEventListener("click", activate);
    box.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); activate(); }});
    box.addEventListener("dragover",e=>{ e.preventDefault(); box.classList.add("over"); });
    box.addEventListener("dragleave",()=>box.classList.remove("over"));
    box.addEventListener("drop",e=>{
      e.preventDefault(); box.classList.remove("over");
      const [sb,id] = (e.dataTransfer.getData("text/plain")||"").split("|");
      if(id && +sb===bi) fullPlace(bi, qi, id);
    });
  });
  scope.querySelectorAll(".wb-words").forEach(words=>{
    const bi = +words.dataset.bankof;
    words.addEventListener("dragover",e=>e.preventDefault());
    words.addEventListener("drop",e=>{
      e.preventDefault();
      const [sb,id] = (e.dataTransfer.getData("text/plain")||"").split("|");
      if(+sb!==bi) return;
      const qi = Object.keys(full.blocks[bi].placed).find(k=>full.blocks[bi].placed[k]===id);
      if(qi!==undefined) fullReturn(bi, +qi);
    });
  });
}

/* ---------- TEST (multiple choice only) ---------- */
function startTest(){
  const pool = curPool();
  const n = state.testLen===0 ? pool.length : Math.min(state.testLen, pool.length);
  const terms = shuffle(pool).slice(0,n);
  test = { pool, diff:state.diff, questions:terms.map(t=>makeMC(t,pool,state.diff)), answers:{}, graded:false };
  renderTest();
}
function renderTest(){
  const qs = test.questions;
  let head = "";
  if(test.graded){
    const right = qs.filter((q,i)=>test.answers[i]===q.answer).length;
    const pct = Math.round(right/qs.length*100);
    head = `<div class="score">
      <span class="big">${pct}%</span>
      <span class="detail"><b>${right} of ${qs.length} correct</b>${pct===100?"¡Perfecto!":pct>=80?"Nice — polish the ones marked below.":"Worth another pass on the ones marked below."}</span>
      <span class="spacer"></span>
      <span class="row">
        <button class="btn" id="newTest">Nuevo examen</button>
        ${right<qs.length?'<button class="btn ghost" id="retryMissed">Repasar las falladas</button>':''}
      </span></div>`;
  }
  const body = qs.map((q,i)=>{
    const chosen = test.answers[i], item = q.term;
    const cls = test.graded ? (chosen===q.answer?"marked-ok":"marked-wrong") : "";
    return `<div class="q ${cls}">
      <div class="q-head">
        <span class="q-num">${test.graded?(chosen===q.answer?"&#10003;":"&#10007;"):(i+1)+"."}</span>
        <p class="q-text ${promptClass(item,test.diff)}">${fmt(q.prompt)}</p>
      </div>
      <div class="opts">${q.options.map((o,k)=>{
        let c = "";
        if(test.graded){ if(o===q.answer) c="correct"; else if(o===chosen) c="wrong"; }
        else if(o===chosen) c="chosen";
        return `<button class="opt ${c}" ${test.graded?"disabled":""} data-q="${i}" data-opt="${esc(o)}">
          <span class="num">${"ABCD"[k]}</span><span class="${optClass(item,test.diff)}">${esc(o)}</span></button>`;
      }).join("")}</div>
      ${test.graded && item.kind==="vocab" && test.diff!=="easy" ? `<p class="gloss"><span class="es">${esc(item.es)}</span> &mdash; ${esc(item.en)}</p>` : ""}
    </div>`;
  }).join("");
  const footer = test.graded ? "" :
    `<div class="row" style="margin-top:24px">
      <button class="btn" id="submitTest">Entregar</button>
      <span class="hint" style="margin:0" id="count">${Object.keys(test.answers).length} of ${qs.length} answered</span>
    </div>`;
  panel.innerHTML = head + `<div class="card">${body}</div>` + footer;
  updateReportLink();

  panel.querySelectorAll(".opt:not(:disabled)").forEach(b=>{
    b.addEventListener("click",()=>{
      const i = +b.dataset.q;
      test.answers[i] = b.dataset.opt;
      panel.querySelectorAll('.opt[data-q="'+i+'"]').forEach(x=>x.classList.remove("chosen"));
      b.classList.add("chosen");
      const c = $("#count"); c.textContent = `${Object.keys(test.answers).length} of ${qs.length} answered`; c.style.color="";
      skipWarned = false;
    });
  });
  if(!test.graded){
    $("#submitTest").addEventListener("click",()=>{
      const left = qs.length - Object.keys(test.answers).length;
      if(left>0 && !confirmSkip(left)) return;
      test.graded = true; renderTest(); window.scrollTo({top:0,behavior:"smooth"});
    });
  }else{
    $("#newTest").addEventListener("click", startTest);
    const rm = $("#retryMissed");
    if(rm) rm.addEventListener("click",()=>{
      const missedTerms = test.questions.filter((q,i)=>test.answers[i]!==q.answer).map(q=>q.term);
      test = { pool:test.pool, diff:test.diff, questions:shuffle(missedTerms).map(t=>makeMC(t,test.pool,test.diff)), answers:{}, graded:false };
      renderTest(); window.scrollTo({top:0,behavior:"smooth"});
    });
  }
}
let skipWarned = false;
function confirmSkip(left){
  if(skipWarned){ skipWarned=false; return true; }
  skipWarned = true;
  const c = $("#count"); c.textContent = `${left} unanswered — those count as wrong. Press Entregar again to submit.`; c.style.color="var(--bad)";
  return false;
}

/* ---------- LISTA ---------- */
function renderList(){
  const groups = curGroups();
  const showDefs = state.diff!=="easy";
  const defKey = state.diff==="hard" ? "ds" : "de";
  const both = state.diff==="fill";   /* Frases level: the list shows both definitions, not the sentence */
  const inner = groups.map(g=>{
    let rows;
    if(g.kind==="quiz"){
      rows = `<div class="deftable">${g.items.map(t=>`<div class="row2"><div class="qq">${esc(t.q)}</div><div class="aa">${esc(t.a)}</div></div>`).join("")}</div>`;
    }else if(g.kind==="gram"){
      rows = `<div class="deftable">${g.items.map(t=>`<div class="row2"><div class="qq">${fmt(t.q)}</div><div class="aa">${esc(t.a)}${t.alt.length?` <span class="alt">(también: ${esc(t.alt.join(", "))})</span>`:""}</div><div class="d">${esc(t.why)}</div></div>`).join("")}</div>`;
    }else if(both){
      rows = `<div class="deftable">${g.items.map(t=>
        `<div class="row2"><div class="t">${esc(t.es)}<span class="en">${esc(t.en)}</span></div>
         <div class="d spanish">${esc(t.ds)}</div>
         <div class="d">${esc(t.de)}</div></div>`).join("")}</div>`;
    }else if(showDefs){
      rows = `<div class="deftable">${g.items.map(t=>
        `<div class="row2"><div class="t">${esc(t.es)}<span class="en">${esc(t.en)}</span></div>
         <div class="d ${state.diff==='hard'?'spanish':''}">${esc(t[defKey])}</div></div>`).join("")}</div>`;
    }else{
      rows = `<div class="vocab">${g.items.map(t=>`<div class="item"><span class="es">${esc(t.es)}</span><span class="en">${esc(t.en)}</span></div>`).join("")}</div>`;
    }
    return `<section class="listsec"><h2>${esc(g.name)} &middot; ${g.items.length}</h2>${rows}</section>`;
  }).join("");
  panel.innerHTML = `<div class="card">${inner}</div>` +
    (realVocab() ? `<p class="foot">Words show ${both?'the Spanish and English definitions':showDefs?(state.diff==='hard'?'Spanish definitions':'English definitions'):'English meanings only'} &mdash; switch with the Nivel buttons.</p>` : "");
  updateReportLink();
}

/* ---------- chrome ---------- */
function chipRow(container, chips, current, onPick){
  container.innerHTML = chips.map(c=>
    `<button class="chip" data-id="${c.id}" aria-pressed="${c.id===current}">${esc(c.name)}${c.n!==undefined?`<span class="n">${c.n}</span>`:""}</button>`).join("");
  container.querySelectorAll(".chip").forEach(b=>b.addEventListener("click",()=>{ onPick(b.dataset.id); }));
}
function buildPartChips(){
  const set = curSet();
  if(set.sections){
    $("#sectionField").hidden = false;
    chipRow($("#sectionGroup"),
      set.sections.map(s=>({id:s.id,name:s.name,n:set.groups.filter(g=>g.section===s.id).reduce((a,g)=>a+g.items.length,0)})).concat([{id:"all",name:"Todo",n:set.all.length}]),
      state.section, id=>{ state.section=id; state.group="all"; render(); });
    const subs = state.section==="all" ? [] : set.groups.filter(g=>g.section===state.section);
    $("#groupField").hidden = subs.length<2;
    $("#groupLabel").textContent = "Sección";
    if(subs.length>=2){
      chipRow($("#groupGroup"), subs.map(g=>({id:g.id,name:g.name,n:g.items.length})).concat([{id:"all",name:"Todas"}]),
        state.group, id=>{ state.group=id; render(); });
    }
  }else{
    $("#sectionField").hidden = true;
    $("#groupField").hidden = false;
    $("#groupLabel").textContent = "Parte";
    chipRow($("#groupGroup"), set.groups.map(g=>({id:g.id,name:g.name,n:g.items.length})).concat([{id:"all",name:set.groups.length===2?"Ambos":"Todos"}]),
      state.group, id=>{ state.group=id; render(); });
  }
}
function buildDiffChips(){
  const isMatch = state.mode==="match", fill = curSet().hasFill;
  const opts = isMatch ? [["easy",MATCH_DIFF.easy.label],["hard",MATCH_DIFF.hard.label]].concat(fill?[["fill",MATCH_DIFF.fill.label]]:[])
                       : [["easy",DIFF.easy.label],["medium",DIFF.medium.label],["hard",DIFF.hard.label]].concat(fill?[["fill",DIFF.fill.label]]:[]);
  chipRow($("#diffGroup"), opts.map(([id,label])=>({id,name:label})), isMatch?state.matchDiff:state.diff,
    id=>{ if(state.mode==="match") state.matchDiff=id; else state.diff=id; render(); });
}
function render(){
  clearInterval(matchTimer);
  const home = state.view==="home";
  $("#setHead").hidden = home;
  $("#controls").hidden = home;
  if(home){ updateReportLink(); renderHome(); return; }

  const set = curSet();
  const vocab = hasVocab();
  if(!set.hasFill){ if(state.diff==="fill") state.diff="easy"; if(state.matchDiff==="fill") state.matchDiff="easy"; }
  if(vocab && !realVocab()){ state.diff = "fill"; state.matchDiff = "fill"; }
  if(!vocab && (state.mode==="wordbank" || state.mode==="match")) state.mode = "test";
  document.querySelectorAll('.tab[data-mode="wordbank"], .tab[data-mode="match"]').forEach(t=>t.hidden = set.nDrill===0);
  $('.tab[data-mode="full"]').hidden = !(set.nQuiz>0 && set.nDrill>0);
  if(state.mode==="full" && !(set.nQuiz>0 && set.nDrill>0)) state.mode = "test";
  const isFull = state.mode==="full";
  $("#sectionField").hidden = isFull; $("#groupField").hidden = isFull;
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected", String(t.dataset.mode===state.mode)));
  $("#setTag").textContent = set.tag || "";
  $("#setTag").hidden = !set.tag;
  $("#pageTitle").textContent = set.name;
  $("#pageSub").textContent = [set.nVocab?`${set.nVocab} palabras`:null, set.nGram?`${set.nGram} verbos`:null, set.nQuiz?`${set.nQuiz} preguntas`:null].filter(Boolean).join(" · ");
  if(!isFull) buildPartChips();
  $("#diffField").hidden = !realVocab() || isFull;
  $("#lenField").hidden = state.mode!=="test";
  if(realVocab() && !isFull) buildDiffChips();

  const poolQuizOnly = !vocab;
  let note;
  if(isFull) note = `<b>Examen completo</b><span>The whole set in one sitting: every word as a sentence with a blank (word banks of ${FULL_BLOCK}, ${FULL_DECOYS} decoys each), then every story and song question as multiple choice. One grade at the end.</span>`;
  else if(state.mode==="list") note = poolQuizOnly
    ? "<span>Every question with its answer &mdash; read straight through before you drill.</span>"
    : "<span>The full list. Nivel switches between meanings, English definitions and Spanish definitions.</span>";
  else if(vocab && !realVocab() && state.mode==="wordbank") note = `<b>Banco de verbos</b><span>Cada frase tiene un hueco y el infinitivo entre paréntesis; arrastra la forma correcta. ${WB_LEN} frases, ${WB_LEN+WB_DECOYS} formas en el banco (${WB_DECOYS} sobran).</span>`;
  else if(vocab && !realVocab() && state.mode==="match") note = `<b>Emparejar</b><span>Une cada frase con la forma verbal que la completa. Seis parejas contra el reloj.</span>`;
  else if(vocab && !realVocab() && state.mode==="learn") note = `<b>Aprender</b><span>Rondas de cinco: escoge la forma correcta, luego escríbela &mdash; con acentos. Cada respuesta explica por qué ese tiempo.</span>`;
  else if(vocab && !realVocab() && state.mode==="test") note = `<b>Examen</b><span>Escoge el tiempo correcto para cada hueco. Las cuatro opciones son formas del mismo verbo.</span>`;
  else if(state.mode==="wordbank") note = `<b>${DIFF[state.diff].label}</b><span>${WB_NOTE[state.diff]} ${WB_LEN} questions and ${WB_LEN+WB_DECOYS} words in the bank &mdash; ${WB_DECOYS} of them are decoys. Drag a word into a box, or tap the word then the box.</span>`;
  else if(state.mode==="match") note = `<b>${MATCH_DIFF[state.matchDiff].label}</b><span>${MATCH_DIFF[state.matchDiff].note} Six pairs, against the clock &mdash; a wrong pair costs a second.</span>`;
  else if(poolQuizOnly) note = state.mode==="learn"
    ? "<b>Aprender</b><span>Rounds of five questions. Miss one and it comes back later in the round.</span>"
    : "<b>Examen</b><span>Multiple choice, graded at the end. All four options are about the same length, so length never gives the answer away.</span>";
  else note = `<b>${DIFF[state.diff].label}</b><span>${DIFF[state.diff].note}${state.mode==="learn"?" Rounds of five: multiple choice until all five are right, then the words come back as typing. Miss one and it comes back later in the round.":""}</span>`;
  $("#modeNote").innerHTML = note;

  if(state.mode==="learn") startLearn();
  else if(state.mode==="full") startFull();
  else if(state.mode==="test") startTest();
  else if(state.mode==="wordbank") startWordbank();
  else if(state.mode==="match") startMatch();
  else renderList();
}
function setMode(m){ state.mode = m; render(); }
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>setMode(t.dataset.mode)));
document.querySelectorAll("#lenGroup .chip").forEach(c=>c.addEventListener("click",()=>{
  state.testLen = +c.dataset.len;
  document.querySelectorAll("#lenGroup .chip").forEach(x=>x.setAttribute("aria-pressed", String(x===c)));
  render();
}));
const goHome = ()=>{ state.view="home"; render(); window.scrollTo({top:0}); };
$("#backBtn").addEventListener("click", goHome);
$("#brandBtn").addEventListener("click",()=>{ if(state.view!=="home") goHome(); });
document.addEventListener("keydown",e=>{
  if(state.view!=="study"||state.mode!=="learn"||!learn) return;
  if(learn.step!=="ask"){ if(e.key==="Enter"){ e.preventDefault(); nextLearn(); } return; }
  if((e.target.tagName||"").toLowerCase()==="input") return;
  if(/^[1-4]$/.test(e.key)){ const btns = panel.querySelectorAll(".opt"); if(btns[+e.key-1]) btns[+e.key-1].click(); }
});
render();
</script>
</body>
</html>
